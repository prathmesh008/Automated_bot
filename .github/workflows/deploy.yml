name: Deploy AI Job Bot to Azure

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            if [ -d "$HOME/job-applier" ]; then
              cd "$HOME/job-applier"
            elif [ -d "$HOME/Automated_bot" ]; then
              cd "$HOME/Automated_bot"
            elif [ -d "$HOME/ai_job_bot" ]; then
              cd "$HOME/ai_job_bot"
            else
              echo "Error: Could not locate repo directory in $HOME"
              exit 1
            fi
            echo "Deploying in $(pwd)..."
            git pull origin main
            docker compose down || true
            docker compose up -d --build

